name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Public repo — see github-actions-runner-policy (grāmatr standard):
    # arc-runner-gramatr refuses jobs from public repos, so this stays on
    # GitHub-hosted ubuntu-latest, which public repos get free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies (en_core_web_lg is a direct dependency, no separate download step)
        run: uv sync --frozen

      - name: Run daemon tests (no model-accuracy assertions, fail fast on these)
        run: uv run pytest tests/test_daemon.py -v

      - name: Run engine tests (real Presidio + spaCy detection/redaction)
        run: uv run pytest tests/test_engine.py -v

      - name: Run entity-coverage eval
        working-directory: eval
        run: uv run python compare_configs.py
