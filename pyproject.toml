[project]
name = "pii-guard"
version = "0.1.0"
description = "PII detection daemon (Microsoft Presidio) — sibling to secret-guard and injection-guard. No hosted tier by design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
]

[project.scripts]
pii-guard-daemon = "pii_guard.daemon:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pii_guard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
