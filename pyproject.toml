[project]
name = "pii-guard"
version = "0.1.0"
description = "PII detection daemon (Microsoft Presidio) — sibling to secret-guard and injection-guard. No hosted tier by design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
  # en_core_web_lg as a direct pip dependency (its published wheel URL),
  # NOT a separate `spacy download` step — found the hard way: `uv tool
  # install` only installs what's declared here. A manual post-install
  # download step (what every test in this repo's history actually
  # ran) has no equivalent for `uv tool install`, so the daemon crash-
  # looped on first real install with no model present at all.
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
pii-guard-daemon = "pii_guard.daemon:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pii_guard"]

[tool.hatch.metadata]
# Required for the en-core-web-lg direct-URL dependency above. This
# package is only ever installed via `uv tool install git+https://...`
# or from this source tree, never published to PyPI, so hatchling's
# default restriction on direct references doesn't protect anything
# meaningful here.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
